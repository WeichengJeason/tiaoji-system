<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调剂意向采集表</title>
<script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@2.6.3/dist/index.browser.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: linear-gradient(135deg, #fdf6ec 0%, #f0e6d3 100%); font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 30px 16px; }
  .container { max-width: 580px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 28px; }
  .header .subtitle { font-size: 11px; letter-spacing: 4px; color: #c8a96e; margin-bottom: 8px; text-transform: uppercase; }
  .header h1 { font-size: 26px; font-weight: 700; color: #2d2416; margin-bottom: 6px; }
  .header .desc { font-size: 13px; color: #c8a96e; font-weight: 600; margin-bottom: 4px; }
  .header p { font-size: 12px; color: #a08060; }
  .card { background: #fff; border-radius: 16px; padding: 32px 28px; box-shadow: 0 8px 40px rgba(180,140,80,0.12); border: 1px solid #f0e8d5; }
  .section-title { font-size: 11px; font-weight: 700; color: #c8a96e; letter-spacing: 3px; text-transform: uppercase; margin: 24px 0 14px; padding-bottom: 6px; border-bottom: 1px solid #f0e8d5; }
  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-3 { grid-template-columns: 1fr 1fr 1fr; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; color: #8b7355; font-weight: 500; }
  input, select, textarea { padding: 10px 12px; border: 1.5px solid #e2d9c8; border-radius: 8px; font-size: 14px; background: #fffdf9; color: #2d2416; outline: none; width: 100%; font-family: inherit; transition: border-color 0.2s; }
  input:focus, select:focus, textarea:focus { border-color: #c8a96e; }
  textarea { height: 80px; resize: vertical; }
  .required::after { content: " *"; color: #e74c3c; }
  .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #c8a96e, #a07840); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; letter-spacing: 1px; margin-top: 8px; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #c0392b; font-size: 13px; padding: 8px 12px; background: #fdf0ee; border-radius: 6px; margin-bottom: 12px; }
  .footer-note { text-align: center; margin-top: 14px; font-size: 12px; color: #b09070; }
  .success { text-align: center; padding: 60px 20px; }
  .success .icon { font-size: 64px; margin-bottom: 20px; }
  .success h2 { font-size: 24px; color: #2d2416; margin-bottom: 10px; }
  .success p { color: #8b7355; font-size: 14px; }
  @media(max-width:480px) { .row-2, .row-3 { grid-template-columns: 1fr; } .card { padding: 20px 16px; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="subtitle">Graduate Application</div>
    <h1>调剂意向采集表</h1>
    <div class="desc">香蕉教育 · 保姆班 / 保过班学员填写</div>
    <p>请如实填写以下信息，提交后由老师统一查看</p>
  </div>

  <div class="card" id="formCard">
    <div class="section-title">基本信息</div>
    <div class="row row-2">
      <div class="field"><label class="required">考生姓名</label><input id="name" placeholder="请输入姓名"></div>
      <div class="field"><label class="required">联系电话</label><input id="phone" placeholder="请输入手机号" type="tel"></div>
    </div>
    <div class="row row-2">
      <div class="field"><label>本/专科学校</label><input id="undergradSchool" placeholder="如：河南中医药大学"></div>
      <div class="field"><label>本/专科专业</label><input id="undergradMajor" placeholder="如：中西医临床医学"></div>
    </div>
    <div class="row row-2">
      <div class="field"><label>学历类型</label><select id="degreeType"><option>本科</option><option>专科</option></select></div>
      <div class="field"><label>外语类型</label><select id="examType"><option>英语一</option><option>英语二</option><option>日语</option><option>俄语</option><option>其他</option></select></div>
    </div>

    <div class="section-title">考研成绩</div>
    <div class="row row-3">
      <div class="field"><label class="required">总分</label><input id="totalScore" placeholder="如：336" type="number"></div>
      <div class="field"><label>政治</label><input id="politics" placeholder="如：52" type="number"></div>
      <div class="field"><label>外语</label><input id="english" placeholder="如：48" type="number"></div>
    </div>
    <div class="row row-2">
      <div class="field"><label>业务课一名称</label><input id="course1Name" placeholder="如：中医综合（307）"></div>
      <div class="field"><label>业务课一分数</label><input id="course1Score" placeholder="如：236" type="number"></div>
    </div>
    <div class="row row-2">
      <div class="field"><label>业务课二名称</label><input id="course2Name" placeholder="选填"></div>
      <div class="field"><label>业务课二分数</label><input id="course2Score" placeholder="选填" type="number"></div>
    </div>

    <div class="section-title">报考信息</div>
    <div class="field" style="margin-bottom:14px"><label>报考院校</label><input id="targetSchool" placeholder="如：南京中医药大学"></div>
    <div class="field" style="margin-bottom:14px"><label>报考专业</label><input id="targetMajor" placeholder="如：中医妇科（常州市中医院）"></div>
    <div class="row row-3">
      <div class="field"><label>专业代码</label><input id="targetCode" placeholder="如：105704"></div>
      <div class="field"><label>学硕/专硕</label><select id="degreeCategory"><option>专硕</option><option>学硕</option></select></div>
      <div class="field"><label>接受非全日制</label><select id="acceptPartTime"><option>否</option><option>是</option></select></div>
    </div>
    <div class="field" style="margin-top:14px">
      <label>调剂意向</label>
      <textarea id="notes" placeholder="请写下你的调剂意向，如：意向地区、院校层次等"></textarea>
    </div>

    <div id="errorMsg" class="error" style="display:none"></div>
    <button class="btn" id="submitBtn" onclick="submitForm()">提交调剂信息</button>
  </div>

  <div class="success" id="successCard" style="display:none">
    <div class="icon">✅</div>
    <h2>提交成功！</h2>
    <p>老师已收到您的调剂信息，请耐心等待联系。</p>
  </div>
  <div class="footer-note">您的信息仅供老师查阅，不会公开展示</div>
</div>

<script>
const ENV_ID = "tiaoji-9gigtefh6be473ff";
let app = null;

function v(id) { return document.getElementById(id).value.trim(); }

async function submitForm() {
  const name = v('name'), phone = v('phone'), totalScore = v('totalScore');
  if (!name || !phone || !totalScore) {
    const err = document.getElementById('errorMsg');
    err.textContent = '请填写姓名、联系电话和总分';
    err.style.display = 'block';
    return;
  }
  document.getElementById('errorMsg').style.display = 'none';
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '提交中...';

  try {
    // 初始化并匿名登录
    app = cloudbase.init({ env: ENV_ID });
    await app.auth({ persistence: 'session' }).signInAnonymously();
    const db = app.database();
    await db.collection('submissions').add({
      name, phone,
      examType: v('examType'),
      undergradSchool: v('undergradSchool'),
      undergradMajor: v('undergradMajor'),
      degreeType: v('degreeType'),
      totalScore,
      politics: v('politics'),
      english: v('english'),
      course1Name: v('course1Name'),
      course1Score: v('course1Score'),
      course2Name: v('course2Name'),
      course2Score: v('course2Score'),
      targetSchool: v('targetSchool'),
      targetMajor: v('targetMajor'),
      targetCode: v('targetCode'),
      degreeCategory: v('degreeCategory'),
      acceptPartTime: v('acceptPartTime'),
      notes: v('notes'),
      submittedAt: new Date().toLocaleString('zh-CN')
    });
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('successCard').style.display = 'block';
  } catch(e) {
    const errEl = document.getElementById('errorMsg');
    errEl.textContent = '提交失败，请重试：' + e.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '提交调剂信息';
  }
}
</script>
</body>
</html>
