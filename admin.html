<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调剂信息后台管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8f2e8; min-height: 100vh; }

  /* 登录页 */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #2d2416, #5c4422);
  }
  .login-card {
    background: #fff; border-radius: 16px; padding: 40px 36px; width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
  }
  .login-card .icon { font-size: 40px; margin-bottom: 12px; }
  .login-card h2 { font-size: 18px; color: #2d2416; margin-bottom: 24px; }
  .login-card input {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e2d9c8;
    border-radius: 8px; font-size: 14px; margin-bottom: 12px;
    outline: none; font-family: inherit;
  }
  .login-card input:focus { border-color: #c8a96e; }
  .login-btn {
    width: 100%; padding: 12px;
    background: linear-gradient(135deg, #c8a96e, #a07840);
    color: #fff; border: none; border-radius: 8px;
    font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .login-err { color: #c0392b; font-size: 13px; margin-bottom: 8px; }
  .login-hint { margin-top: 14px; font-size: 12px; color: #a08060; }

  /* 管理页 */
  .top-bar {
    background: linear-gradient(135deg, #2d2416, #5c4422);
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .top-bar .left .tag { font-size: 10px; letter-spacing: 3px; color: #c8a96e; margin-bottom: 3px; }
  .top-bar .left h1 { font-size: 18px; color: #fff; font-weight: 600; }
  .top-bar .right { display: flex; align-items: center; gap: 12px; }
  .top-bar .count { color: #c8a96e; font-size: 13px; }
  .refresh-btn, .export-btn {
    padding: 7px 16px; border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500;
  }
  .refresh-btn { background: #c8a96e; color: #fff; }
  .export-btn { background: #27ae60; color: #fff; }

  .main { display: flex; height: calc(100vh - 58px); }

  /* 列表 */
  .list-panel { width: 340px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid #e8dcc8; background: #fff; }
  .list-empty { padding: 60px 20px; text-align: center; color: #a08060; }
  .list-empty .ei { font-size: 40px; margin-bottom: 10px; }
  .list-item {
    padding: 14px 18px; border-bottom: 1px solid #f0e8d5;
    cursor: pointer; transition: background 0.15s;
  }
  .list-item:hover { background: #fffbf5; }
  .list-item.active { background: #fff8ee; border-left: 3px solid #c8a96e; }
  .list-item .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .list-item .name { font-size: 15px; font-weight: 700; color: #2d2416; }
  .list-item .score { font-size: 13px; color: #c8a96e; font-weight: 600; }
  .list-item .time { font-size: 11px; color: #b0a090; }
  .list-item .school { font-size: 12px; color: #8b7355; margin-top: 2px; }
  .list-item .target { font-size: 12px; color: #a07840; margin-top: 1px; }

  /* 详情 */
  .detail-panel { flex: 1; overflow-y: auto; padding: 24px 28px; background: #fff; }
  .detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #b09070; font-size: 14px; }
  .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .detail-header h2 { font-size: 18px; color: #2d2416; }
  .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #a08060; }
  .section-label { font-size: 11px; color: #c8a96e; letter-spacing: 2px; margin: 16px 0 8px; }
  .row-item { display: flex; padding: 8px 0; border-bottom: 1px solid #f5ede0; }
  .row-item .lbl { width: 130px; flex-shrink: 0; font-size: 13px; color: #8b7355; }
  .row-item .val { font-size: 13px; color: #2d2416; font-weight: 500; }

  @media(max-width:700px) {
    .main { flex-direction: column; }
    .list-panel { width: 100%; height: 50vh; }
    .detail-panel { height: 50vh; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-wrap" id="loginPage">
  <div class="login-card">
    <div class="icon">🔐</div>
    <h2>后台管理登录</h2>
    <div id="loginErr" class="login-err" style="display:none"></div>
    <input type="password" id="pwdInput" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">登 录</button>
    <div class="login-hint">默认密码：admin2024</div>
  </div>
</div>

<!-- 管理页 -->
<div id="adminPage" style="display:none">
  <div class="top-bar">
    <div class="left">
      <div class="tag">ADMIN DASHBOARD</div>
      <h1>调剂信息后台管理</h1>
    </div>
    <div class="right">
      <span class="count" id="countLabel">共 0 条记录</span>
      <button class="export-btn" onclick="exportCSV()">导出 Excel</button>
      <button class="refresh-btn" onclick="loadData()">刷 新</button>
    </div>
  </div>
  <div class="main">
    <div class="list-panel" id="listPanel">
      <div class="list-empty"><div class="ei">📭</div><div>加载中...</div></div>
    </div>
    <div class="detail-panel" id="detailPanel">
      <div class="detail-empty">← 点击左侧记录查看详情</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xugzfneciudlyjxzfcri.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1Z3pmbmVjaXVkbHlqeHpmY3JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyNDQ0ODEsImV4cCI6MjA4NzgyMDQ4MX0.vFVYpWaPPWWEfSgK7H05ugyb-F4RtC7pV8hHPZRuDAI";
const ADMIN_PASSWORD = "admin2024";

let allRecords = [];
let activeIndex = -1;

function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('adminPage').style.display = 'block';
    loadData();
  } else {
    const err = document.getElementById('loginErr');
    err.textContent = '密码错误，请重试';
    err.style.display = 'block';
  }
}

async function loadData() {
  document.getElementById('listPanel').innerHTML = '<div class="list-empty"><div class="ei">⏳</div><div>加载中...</div></div>';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions?select=*&order=submitted_at.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    allRecords = await res.json();
    renderList();
    document.getElementById('countLabel').textContent = `共 ${allRecords.length} 条记录`;
  } catch(e) {
    document.getElementById('listPanel').innerHTML = '<div class="list-empty"><div class="ei">❌</div><div>加载失败，请刷新重试</div></div>';
  }
}

function renderList() {
  if (!allRecords.length) {
    document.getElementById('listPanel').innerHTML = '<div class="list-empty"><div class="ei">📭</div><div>暂无提交记录</div></div>';
    return;
  }
  const html = allRecords.map((r, i) => `
    <div class="list-item ${i===activeIndex?'active':''}" onclick="showDetail(${i})">
      <div class="top">
        <span class="name">${r.name || '—'}</span>
        <span class="score">总分 ${r.total_score || '—'}</span>
      </div>
      <div class="time">${r.submitted_at ? new Date(r.submitted_at).toLocaleString('zh-CN') : ''}</div>
      <div class="school">${r.undergrad_school || ''} · ${r.undergrad_major || ''}</div>
      <div class="target">报考：${r.target_school || ''} ${r.target_major || ''}</div>
    </div>
  `).join('');
  document.getElementById('listPanel').innerHTML = html;
}

function showDetail(i) {
  activeIndex = i;
  renderList();
  const r = allRecords[i];
  const row = (lbl, val) => `<div class="row-item"><span class="lbl">${lbl}</span><span class="val">${val || '—'}</span></div>`;
  const sec = (t) => `<div class="section-label">── ${t}</div>`;
  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-header">
      <h2>${r.name} 的调剂信息</h2>
      <button class="close-btn" onclick="closeDetail()">×</button>
    </div>
    ${row('提交时间', r.submitted_at ? new Date(r.submitted_at).toLocaleString('zh-CN') : '')}
    ${row('联系电话', r.phone)}
    ${row('学历类型', r.degree_type)}
    ${row('本/专科学校', r.undergrad_school)}
    ${row('本/专科专业', r.undergrad_major)}
    ${sec('考研成绩')}
    ${row('总分', r.total_score)}
    ${row('政治', r.politics)}
    ${row(`外语（${r.exam_type||''}）`, r.english)}
    ${row('业务课一', r.course1_name && r.course1_score ? r.course1_name + '：' + r.course1_score + ' 分' : r.course1_name)}
    ${row('业务课二', r.course2_name && r.course2_score ? r.course2_name + '：' + r.course2_score + ' 分' : r.course2_name)}
    ${sec('报考信息')}
    ${row('报考院校', r.target_school)}
    ${row('报考专业', r.target_major)}
    ${row('专业代码', r.target_code)}
    ${row('学硕/专硕', r.degree_category)}
    ${row('接受非全日制', r.accept_part_time)}
    ${r.notes ? row('备注', r.notes) : ''}
  `;
}

function closeDetail() {
  activeIndex = -1;
  renderList();
  document.getElementById('detailPanel').innerHTML = '<div class="detail-empty">← 点击左侧记录查看详情</div>';
}

function exportCSV() {
  if (!allRecords.length) { alert('暂无数据可导出'); return; }
  const headers = ['姓名','电话','学历','本科学校','本科专业','外语类型','总分','政治','外语','业务课一','业务课一分数','业务课二','业务课二分数','报考院校','报考专业','专业代码','学硕专硕','非全日制','备注','提交时间'];
  const keys = ['name','phone','degree_type','undergrad_school','undergrad_major','exam_type','total_score','politics','english','course1_name','course1_score','course2_name','course2_score','target_school','target_major','target_code','degree_category','accept_part_time','notes','submitted_at'];
  const rows = allRecords.map(r => keys.map(k => {
    let v = r[k] || '';
    if (k === 'submitted_at' && v) v = new Date(v).toLocaleString('zh-CN');
    return `"${String(v).replace(/"/g, '""')}"`;
  }).join(','));
  const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = '调剂信息_' + new Date().toLocaleDateString('zh-CN') + '.csv';
  a.click();
}
</script>
</body>
</html>
