<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香蕉教育 · 调剂信息后台管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8f2e8; min-height: 100vh; }

  /* 登录页 */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #2d2416, #5c4422); }
  .login-card { background: #fff; border-radius: 16px; padding: 40px 36px; width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
  .login-card .icon { font-size: 40px; margin-bottom: 12px; }
  .login-card h2 { font-size: 18px; color: #2d2416; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 11px 14px; border: 1.5px solid #e2d9c8; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; font-family: inherit; }
  .login-card input:focus { border-color: #c8a96e; }
  .login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #c8a96e, #a07840); color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600; }
  .login-err { color: #c0392b; font-size: 13px; margin-bottom: 8px; }
  .login-hint { margin-top: 14px; font-size: 12px; color: #a08060; }

  /* 顶栏 */
  .top-bar { background: linear-gradient(135deg, #2d2416, #5c4422); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .top-bar .left .tag { font-size: 10px; letter-spacing: 3px; color: #c8a96e; }
  .top-bar .left h1 { font-size: 17px; color: #fff; font-weight: 600; }
  .top-bar .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .top-btn { padding: 7px 14px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500; }
  .btn-gold { background: #c8a96e; color: #fff; }
  .btn-green { background: #27ae60; color: #fff; }
  .btn-gray { background: #95a5a6; color: #fff; }

  /* 统计栏 */
  .stats-bar { display: flex; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ede5d5; flex-wrap: wrap; }
  .stat-item { flex: 1; min-width: 100px; background: #fffbf5; border: 1px solid #f0e8d5; border-radius: 10px; padding: 10px 14px; text-align: center; }
  .stat-item .num { font-size: 22px; font-weight: 700; color: #c8a96e; }
  .stat-item .lbl { font-size: 11px; color: #a08060; margin-top: 2px; }

  /* 搜索栏 */
  .search-bar { padding: 10px 16px; background: #fff; border-bottom: 1px solid #ede5d5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search-bar input { flex: 1; min-width: 160px; padding: 8px 12px; border: 1.5px solid #e2d9c8; border-radius: 8px; font-size: 13px; outline: none; font-family: inherit; background: #fffdf9; }
  .search-bar input:focus { border-color: #c8a96e; }
  .search-bar select { padding: 8px 10px; border: 1.5px solid #e2d9c8; border-radius: 8px; font-size: 13px; outline: none; font-family: inherit; background: #fffdf9; cursor: pointer; }
  .clear-btn { padding: 7px 12px; background: #ecf0f1; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; color: #7f8c8d; }

  /* 主体 */
  .main { display: flex; height: calc(100vh - 168px); }

  /* 列表 */
  .list-panel { width: 320px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid #e8dcc8; background: #fff; }
  .list-empty { padding: 50px 20px; text-align: center; color: #a08060; }
  .list-empty .ei { font-size: 36px; margin-bottom: 10px; }
  .list-item { padding: 12px 16px; border-bottom: 1px solid #f0e8d5; cursor: pointer; transition: background 0.15s; position: relative; }
  .list-item:hover { background: #fffbf5; }
  .list-item.active { background: #fff8ee; border-left: 3px solid #c8a96e; }
  .list-item .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3px; }
  .list-item .name { font-size: 14px; font-weight: 700; color: #2d2416; }
  .list-item .score { font-size: 12px; color: #c8a96e; font-weight: 600; }
  .list-item .time { font-size: 11px; color: #b0a090; }
  .list-item .school { font-size: 11px; color: #8b7355; margin-top: 2px; }
  .list-item .target { font-size: 11px; color: #a07840; margin-top: 1px; }
  .del-btn { position: absolute; right: 10px; bottom: 10px; background: #fdecea; border: none; border-radius: 5px; padding: 3px 8px; font-size: 11px; color: #e74c3c; cursor: pointer; display: none; }
  .list-item:hover .del-btn { display: block; }

  /* 详情 */
  .detail-panel { flex: 1; overflow-y: auto; padding: 20px 24px; background: #fafaf7; }
  .detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #b09070; font-size: 14px; flex-direction: column; gap: 10px; }
  .detail-empty .de-icon { font-size: 40px; }
  .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .detail-header h2 { font-size: 17px; color: #2d2416; }
  .detail-actions { display: flex; gap: 8px; }
  .action-btn { padding: 6px 14px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 500; }
  .btn-red { background: #fdecea; color: #e74c3c; }
  .btn-red:hover { background: #e74c3c; color: #fff; }
  .close-btn { background: #ecf0f1; color: #7f8c8d; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

  .section-label { font-size: 10px; color: #c8a96e; letter-spacing: 2px; margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #f0e8d5; }
  .row-item { display: flex; padding: 7px 0; border-bottom: 1px solid #f5ede0; }
  .row-item .lbl { width: 120px; flex-shrink: 0; font-size: 12px; color: #8b7355; }
  .row-item .val { font-size: 12px; color: #2d2416; font-weight: 500; }

  /* 确认弹窗 */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 28px 28px 22px; width: 300px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
  .modal .m-icon { font-size: 36px; margin-bottom: 10px; }
  .modal h3 { font-size: 16px; color: #2d2416; margin-bottom: 8px; }
  .modal p { font-size: 13px; color: #888; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600; }
  .btn-cancel { background: #ecf0f1; color: #7f8c8d; }
  .btn-confirm-del { background: #e74c3c; color: #fff; }

  @media(max-width:700px) {
    .main { flex-direction: column; height: auto; }
    .list-panel { width: 100%; max-height: 45vh; }
    .detail-panel { min-height: 50vh; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-wrap" id="loginPage">
  <div class="login-card">
    <div class="icon">🔐</div>
    <h2>后台管理登录</h2>
    <div id="loginErr" class="login-err" style="display:none"></div>
    <input type="password" id="pwdInput" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">登 录</button>
    <div class="login-hint">默认密码：admin2024</div>
  </div>
</div>

<!-- 管理页 -->
<div id="adminPage" style="display:none">
  <!-- 顶栏 -->
  <div class="top-bar">
    <div class="left">
      <div class="tag">香蕉教育 · ADMIN DASHBOARD</div>
      <h1>调剂信息后台管理</h1>
    </div>
    <div class="right">
      <button class="top-btn btn-green" onclick="exportCSV()">📥 导出 Excel</button>
      <button class="top-btn btn-gold" onclick="loadData()">🔄 刷新</button>
      <button class="top-btn btn-gray" onclick="logout()">退出</button>
    </div>
  </div>

  <!-- 统计栏 -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><div class="num" id="statTotal">0</div><div class="lbl">总记录数</div></div>
    <div class="stat-item"><div class="num" id="statAvg">—</div><div class="lbl">平均总分</div></div>
    <div class="stat-item"><div class="num" id="statMax">—</div><div class="lbl">最高分</div></div>
    <div class="stat-item"><div class="num" id="statToday">0</div><div class="lbl">今日新增</div></div>
  </div>

  <!-- 搜索栏 -->
  <div class="search-bar">
    <input id="searchInput" placeholder="🔍 搜索姓名、学校、专业、电话..." oninput="doSearch()">
    <select id="filterDegree" onchange="doSearch()">
      <option value="">全部学历</option>
      <option value="本科">本科</option>
      <option value="专科">专科</option>
    </select>
    <select id="filterCategory" onchange="doSearch()">
      <option value="">全部类型</option>
      <option value="专硕">专硕</option>
      <option value="学硕">学硕</option>
    </select>
    <button class="clear-btn" onclick="clearSearch()">清除筛选</button>
    <span style="font-size:12px;color:#a08060" id="searchCount"></span>
  </div>

  <div class="main">
    <!-- 列表 -->
    <div class="list-panel" id="listPanel">
      <div class="list-empty"><div class="ei">⏳</div><div>加载中...</div></div>
    </div>
    <!-- 详情 -->
    <div class="detail-panel" id="detailPanel">
      <div class="detail-empty"><div class="de-icon">👈</div><div>点击左侧记录查看详情</div></div>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="delModal">
  <div class="modal">
    <div class="m-icon">🗑️</div>
    <h3>确认删除</h3>
    <p id="delModalText">确定要删除这条记录吗？此操作不可撤销。</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeDelModal()">取消</button>
      <button class="btn-confirm-del" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xugzfneciudlyjxzfcri.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1Z3pmbmVjaXVkbHlqeHpmY3JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyNDQ0ODEsImV4cCI6MjA4NzgyMDQ4MX0.vFVYpWaPPWWEfSgK7H05ugyb-F4RtC7pV8hHPZRuDAI";
const ADMIN_PASSWORD = "admin2024";

let allRecords = [];
let filteredRecords = [];
let activeIndex = -1;
let pendingDeleteId = null;

function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('adminPage').style.display = 'block';
    loadData();
  } else {
    const err = document.getElementById('loginErr');
    err.textContent = '密码错误，请重试';
    err.style.display = 'block';
  }
}

function logout() {
  document.getElementById('adminPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('pwdInput').value = '';
}

async function loadData() {
  document.getElementById('listPanel').innerHTML = '<div class="list-empty"><div class="ei">⏳</div><div>加载中...</div></div>';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions?select=*&order=submitted_at.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    allRecords = await res.json();
    filteredRecords = [...allRecords];
    renderStats();
    renderList();
  } catch(e) {
    document.getElementById('listPanel').innerHTML = '<div class="list-empty"><div class="ei">❌</div><div>加载失败，请刷新重试</div></div>';
  }
}

function renderStats() {
  const total = allRecords.length;
  const scores = allRecords.map(r => parseFloat(r.total_score)).filter(n => !isNaN(n));
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : '—';
  const max = scores.length ? Math.max(...scores) : '—';
  const today = allRecords.filter(r => {
    if (!r.submitted_at) return false;
    const d = new Date(r.submitted_at);
    const now = new Date();
    return d.toDateString() === now.toDateString();
  }).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAvg').textContent = avg;
  document.getElementById('statMax').textContent = max;
  document.getElementById('statToday').textContent = today;
}

function doSearch() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const deg = document.getElementById('filterDegree').value;
  const cat = document.getElementById('filterCategory').value;
  filteredRecords = allRecords.filter(r => {
    const matchKw = !kw || [r.name, r.phone, r.undergrad_school, r.undergrad_major, r.target_school, r.target_major].some(v => v && v.toLowerCase().includes(kw));
    const matchDeg = !deg || r.degree_type === deg;
    const matchCat = !cat || r.degree_category === cat;
    return matchKw && matchDeg && matchCat;
  });
  activeIndex = -1;
  document.getElementById('searchCount').textContent = kw || deg || cat ? `找到 ${filteredRecords.length} 条` : '';
  renderList();
  document.getElementById('detailPanel').innerHTML = '<div class="detail-empty"><div class="de-icon">👈</div><div>点击左侧记录查看详情</div></div>';
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterDegree').value = '';
  document.getElementById('filterCategory').value = '';
  document.getElementById('searchCount').textContent = '';
  filteredRecords = [...allRecords];
  activeIndex = -1;
  renderList();
  document.getElementById('detailPanel').innerHTML = '<div class="detail-empty"><div class="de-icon">👈</div><div>点击左侧记录查看详情</div></div>';
}

function renderList() {
  if (!filteredRecords.length) {
    document.getElementById('listPanel').innerHTML = '<div class="list-empty"><div class="ei">📭</div><div>暂无记录</div></div>';
    return;
  }
  const html = filteredRecords.map((r, i) => `
    <div class="list-item ${i===activeIndex?'active':''}" onclick="showDetail(${i})">
      <div class="top">
        <span class="name">${r.name || '—'}</span>
        <span class="score">总分 ${r.total_score || '—'}</span>
      </div>
      <div class="time">${r.submitted_at ? new Date(r.submitted_at).toLocaleString('zh-CN') : ''}</div>
      <div class="school">${r.undergrad_school||''} · ${r.undergrad_major||''}</div>
      <div class="target">报考：${r.target_school||''} ${r.target_major||''}</div>
      <button class="del-btn" onclick="askDelete(event, ${r.id}, '${(r.name||'').replace(/'/g,"\\'")}')">🗑️ 删除</button>
    </div>
  `).join('');
  document.getElementById('listPanel').innerHTML = html;
}

function showDetail(i) {
  activeIndex = i;
  renderList();
  const r = filteredRecords[i];
  const row = (lbl, val) => `<div class="row-item"><span class="lbl">${lbl}</span><span class="val">${val||'—'}</span></div>`;
  const sec = (t) => `<div class="section-label">── ${t}</div>`;
  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-header">
      <h2>📋 ${r.name} 的调剂信息</h2>
      <div class="detail-actions">
        <button class="action-btn btn-red" onclick="askDelete(event, ${r.id}, '${(r.name||'').replace(/'/g,"\\'")}')">🗑️ 删除此记录</button>
        <button class="close-btn" onclick="closeDetail()">关闭</button>
      </div>
    </div>
    ${row('提交时间', r.submitted_at ? new Date(r.submitted_at).toLocaleString('zh-CN') : '')}
    ${row('联系电话', r.phone)}
    ${row('学历类型', r.degree_type)}
    ${row('本/专科学校', r.undergrad_school)}
    ${row('本/专科专业', r.undergrad_major)}
    ${sec('考研成绩')}
    ${row('总分', r.total_score)}
    ${row('政治', r.politics)}
    ${row(`外语（${r.exam_type||''}）`, r.english)}
    ${row('业务课一', r.course1_name ? r.course1_name + (r.course1_score ? '：'+r.course1_score+'分' : '') : '')}
    ${row('业务课二', r.course2_name ? r.course2_name + (r.course2_score ? '：'+r.course2_score+'分' : '') : '')}
    ${sec('报考信息')}
    ${row('报考院校', r.target_school)}
    ${row('报考专业', r.target_major)}
    ${row('专业代码', r.target_code)}
    ${row('学硕/专硕', r.degree_category)}
    ${row('接受非全日制', r.accept_part_time)}
    ${row('调剂意向', r.notes)}
  `;
}

function closeDetail() {
  activeIndex = -1;
  renderList();
  document.getElementById('detailPanel').innerHTML = '<div class="detail-empty"><div class="de-icon">👈</div><div>点击左侧记录查看详情</div></div>';
}

function askDelete(e, id, name) {
  e.stopPropagation();
  pendingDeleteId = id;
  document.getElementById('delModalText').textContent = `确定要删除「${name}」的记录吗？此操作不可撤销。`;
  document.getElementById('delModal').classList.add('show');
}

function closeDelModal() {
  pendingDeleteId = null;
  document.getElementById('delModal').classList.remove('show');
}

async function confirmDelete() {
  if (!pendingDeleteId) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/submissions?id=eq.${pendingDeleteId}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    closeDelModal();
    closeDetail();
    await loadData();
  } catch(e) {
    alert('删除失败，请重试');
  }
}

function exportCSV() {
  if (!filteredRecords.length) { alert('暂无数据可导出'); return; }
  const headers = ['姓名','电话','学历','本科学校','本科专业','外语类型','总分','政治','外语','业务课一','业务课一分数','业务课二','业务课二分数','报考院校','报考专业','专业代码','学硕专硕','非全日制','调剂意向','提交时间'];
  const keys = ['name','phone','degree_type','undergrad_school','undergrad_major','exam_type','total_score','politics','english','course1_name','course1_score','course2_name','course2_score','target_school','target_major','target_code','degree_category','accept_part_time','notes','submitted_at'];
  const rows = filteredRecords.map(r => keys.map(k => {
    let v = r[k] || '';
    if (k === 'submitted_at' && v) v = new Date(v).toLocaleString('zh-CN');
    return `"${String(v).replace(/"/g,'""')}"`;
  }).join(','));
  const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = '调剂信息_' + new Date().toLocaleDateString('zh-CN') + '.csv';
  a.click();
}
</script>
</body>
</html>
